name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package extension zip
        run: pnpm extension:zip

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: bastion-pilot-extension
          path: packages/extension/bastion-pilot-extension-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bastion-pilot-bridge
          path: packages/bridge/dist/cli.js
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build artifacts
        run: |
          pnpm build
          pnpm extension:zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/extension/bastion-pilot-extension-*.zip
            packages/bridge/dist/cli.js
          generate_release_notes: true
